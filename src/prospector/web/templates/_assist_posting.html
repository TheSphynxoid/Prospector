<div id="assist-posting" class="assist-posting">
  {% include "_assist_posting_status.html" %}
  <details {% if assist.fetch_tried and not assist.posting %}open{% endif %}>
    <summary class="small">Paste the full posting / bid form</summary>
    <form hx-post="/lead/{{ lead_id }}/assist/posting" hx-target="#assist-posting" hx-swap="outerHTML"
          hx-disabled-elt="find button">
      <textarea name="posting" rows="6" maxlength="20000" placeholder="Paste the posting text, including any questions on the bid form.">{{ assist.posting or "" }}</textarea>
      <div class="assist-send-bar">
        <button type="button" class="btn btn-sm" hx-post="/lead/{{ lead_id }}/assist/fetch" hx-target="#assist-posting"
                hx-swap="outerHTML" hx-disabled-elt="this">Try fetching again</button>
        <button type="submit" class="btn btn-sm btn-primary">Save posting</button>
      </div>
    </form>
  </details>
</div>
