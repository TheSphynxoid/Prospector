[project]
name = "prospector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "The Sphynx", email = "jmail.hamza@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler<4",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.2",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
prospector = "prospector.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "time-machine>=3.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads models or hits the network"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
